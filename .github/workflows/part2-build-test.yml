name: Build and Test (API + MVC)

# Builds the Part 2 API, the Part 3 MVC project and the unit tests on every push / pull request,
# then checks that both Docker images build.
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build API, MVC and run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore RaceDay.All.sln

      - name: Build API, tests and MVC project
        run: dotnet build RaceDay.All.sln --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test RaceDay.All.sln --no-build --configuration Release --verbosity normal

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build MVC image
        run: docker build -t raceday-mvc ./Part3-MVC

      - name: Build API image
        run: docker build -t raceday-api ./Part2-API
